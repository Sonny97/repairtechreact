name: E2E Tests - Selenium

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, master, main, release/*]

jobs:
  e2e-tests:
    name: Run E2E Tests with Selenium
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install E2E test dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Chrome and ChromeDriver
        run: |
          wget -q -O chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i chrome.deb || sudo apt-get -f install -y
          rm chrome.deb
          google-chrome --version

      - name: Kill any process on port 3002
        run: sudo lsof -ti:3002 | xargs -r sudo kill -9 || true

      - name: Start frontend server
        run: |
          export PORT=3002
          npm start &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          echo "Frontend server started"

      - name: Wait for frontend to be ready
        run: |
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3002 2>/dev/null | grep -qE "200|302"; then
              echo "Frontend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Frontend failed to start after 60 attempts"
              exit 1
            fi
            sleep 3
          done

      - name: Run E2E Tests - CP-01
        run: npm run test:cp01 -- --forceExit 2>&1 | tee cp01-output.txt
        continue-on-error: true

      - name: Run E2E Tests - CP-02
        run: npm run test:cp02 -- --forceExit 2>&1 | tee cp02-output.txt
        continue-on-error: true

      - name: Run E2E Tests - CP-03
        run: npm run test:cp03 -- --forceExit 2>&1 | tee cp03-output.txt
        continue-on-error: true

      - name: Generate test report
        if: always()
        run: |
          mkdir -p reports
          echo "<html><head><title>E2E Test Report</title>" > reports/report.html
          echo "<style>body{font-family:Arial;padding:20px} pre{background:#f4f4f4;padding:10px;overflow-x:auto}</style>" >> reports/report.html
          echo "</head><body><h1>RepairTech E2E Test Results</h1>" >> reports/report.html
          echo "<h2>$(date)</h2>" >> reports/report.html
          echo "<h3>CP-01 - Navegación</h3><pre>" >> reports/report.html
          grep -E "PASS|FAIL|✓|✗|passed|failed" cp01-output.txt 2>/dev/null | tail -10 >> reports/report.html || echo "No output" >> reports/report.html
          echo "</pre><h3>CP-02 - Contacto</h3><pre>" >> reports/report.html
          grep -E "PASS|FAIL|✓|✗|passed|failed" cp02-output.txt 2>/dev/null | tail -10 >> reports/report.html || echo "No output" >> reports/report.html
          echo "</pre><h3>CP-03 - Login</h3><pre>" >> reports/report.html
          grep -E "PASS|FAIL|✓|✗|passed|failed" cp03-output.txt 2>/dev/null | tail -10 >> reports/report.html || echo "No output" >> reports/report.html
          echo "</pre></body></html>" >> reports/report.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports-${{ github.run_number }}
          path: |
            reports/
            cp01-output.txt
            cp02-output.txt
            cp03-output.txt
          retention-days: 30

      - name: Stop frontend server
        if: always()
        run: sudo lsof -ti:3002 | xargs -r sudo kill -9 || true

      - name: Test Summary
        if: always()
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Case | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CP-01: Navegación | $([ -f cp01-output.txt ] && echo '✅ Executed' || echo '❌ No output') |" >> $GITHUB_STEP_SUMMARY
          echo "| CP-02: Contacto | $([ -f cp02-output.txt ] && echo '✅ Executed' || echo '❌ No output') |" >> $GITHUB_STEP_SUMMARY
          echo "| CP-03: Login | $([ -f cp03-output.txt ] && echo '✅ Executed' || echo '❌ No output') |" >> $GITHUB_STEP_SUMMARY
